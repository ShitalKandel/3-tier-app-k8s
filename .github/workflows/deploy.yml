name: CI/CD Devops Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and Push Backend Image
    - name: Build and Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

    # Build and Push Frontend Image
    - name: Build and Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

    # Connect to Kubernetes Cluster and Apply Configurations
    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/database-statefulset.yml
        kubectl apply -f k8s/backend-deployment.yml
        kubectl apply -f k8s/frontend-deployment.yml
        kubectl apply -f k8s/hpa.yml
        
        # Force Kubernetes to roll out the newly built images immediately
        kubectl rollout restart deployment/backend-deploy
        kubectl rollout restart deployment/frontend-deploy

    # Send status directly to Discord channel
    - name: Notify Discord on Success
      if: success()
      run: |
        curl -H "Content-Type: application/json" \
        -X POST \
        -d '{"content": "🚀 **Deployment Successful!** \n3-Tier App builds passed and deployed successfully to K8s cluster."}' \
        ${{ secrets.DISCORD_WEBHOOK }}

    - name: Notify Discord on Failure
      if: failure()
      run: |
        curl -H "Content-Type: application/json" \
        -X POST \
        -d '{"content": "❌ **Deployment Failed!** \nPipeline broke during build or deployment verification. Check GitHub Actions Logs."}' \
        ${{ secrets.DISCORD_WEBHOOK }}
