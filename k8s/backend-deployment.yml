apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-deploy
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-app
        image: shitalkandel/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources: # memory resource to container and pods  required for HPA autoscaling
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env: 
        - name: DB_HOST
          value: "db_service"


---

apiVersion: v1
kind: Service
metadata: 
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port : 80
    targetPort: 5000
  type: ClusterIP
